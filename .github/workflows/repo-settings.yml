name: repo-settings

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Do not start a run until the previous one finishes, and do not cancel the one in
# flight (both are read-only so they would not conflict, but running them at the same
# time gains nothing).
concurrency:
  group: repo-settings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check repository settings and rulesets
        id: check
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_TOKEN || github.token }}
        run: |
          set -eo pipefail
          # The output also goes into the issue body. The default shell is bash -e
          # without pipefail, so it is set explicitly above (without it tee's exit code
          # is used and a failed check would look like a success).
          ./scripts/sync-repo-config.sh --check 2>&1 | tee "${RUNNER_TEMP}/check.log"

      # steps.check.outcome is part of the condition so that a failure in another
      # step, such as checkout, does not open a bogus "settings have drifted" issue.
      - name: Report the drift as an issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Repository settings have drifted
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/repo-settings.yml
          DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/drift-check.md
        run: |
          set -eo pipefail
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "${TITLE}" 'map(select(.title == $t)) | if length > 0 then .[0].number else empty end')"
          {
            echo "Run log: ${RUN_URL}"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/check.log"
            echo '```'
          } >"${RUNNER_TEMP}/log.md"
          if [ -n "${existing}" ]; then
            # Not a new issue: the same one would pile up daily.
            {
              echo "The [\`repo-settings\`](${WORKFLOW_URL}) check failed again."
              echo
              cat "${RUNNER_TEMP}/log.md"
            } >"${RUNNER_TEMP}/comment.md"
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/comment.md"
            echo "issue #${existing} already exists, added the latest log as a comment"
            exit 0
          fi
          {
            echo "The [\`repo-settings\`](${WORKFLOW_URL}) check failed."
            echo
            cat "${RUNNER_TEMP}/log.md"
            echo
            echo "To fix the items reported as **DRIFT**, run the following locally."
            echo
            echo '```bash'
            echo './scripts/sync-repo-config.sh'
            echo '```'
            echo
            echo "Items reported as **UNKNOWN** mean the token lacks permissions. See [\`docs/drift-check.md\`](${DOC_URL})."
            echo
            echo "Once fixed, this issue closes automatically on the next run."
          } >"${RUNNER_TEMP}/issue.md"
          url="$(gh issue create --title "${TITLE}" --body-file "${RUNNER_TEMP}/issue.md")"
          gh issue edit "${url}" --add-label maintenance ||
            echo "::warning::Could not add the maintenance label. Check whether it still exists (./scripts/sync-repo-config.sh can create it)"

      # When the check fails, execution never reaches this step (it is skipped by
      # default because the previous step failed).
      - name: Close the issue when the drift is gone
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Repository settings have drifted
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          numbers="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "${TITLE}" '.[] | select(.title == $t) | .number')"
          for number in ${numbers}; do
            gh issue close "${number}" --comment "Closing because the check passed: ${RUN_URL}"
          done
